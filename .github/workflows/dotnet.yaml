name: dotnet build and test

on:
  push:
    branches:
      - main
      - claude/dotnet-migration-fwvd9
  pull_request:
    branches:
      - main
      - claude/dotnet-migration-fwvd9

jobs:
  test:
    name: Run dotnet test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Make `cl.exe` available on Windows so dotnet/native/build-natives.cmd
      # can compile the vendored tree-sitter sources. ubuntu-latest and
      # macos-latest already have cc/clang on PATH.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Install pdftotext (Poppler) on Linux for the real-binary extractor
      # test. The test is gated with [SkippableFact]; on macOS/Windows it
      # skips at runtime so we don't add a build dep there.
      - name: Install pdftotext (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Restore
        run: dotnet restore dotnet/Semble.sln

      - name: Build
        run: dotnet build dotnet/Semble.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/Semble.sln --configuration Release --no-build --verbosity normal
