name: dotnet build and test

on:
  push:
    branches:
      - main
      - claude/dotnet-migration-fwvd9
  pull_request:
    branches:
      - main
      - claude/dotnet-migration-fwvd9

jobs:
  test:
    name: Run dotnet test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore dotnet/Semble.sln

      - name: Build
        run: dotnet build dotnet/Semble.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/Semble.sln --configuration Release --no-build --verbosity normal
